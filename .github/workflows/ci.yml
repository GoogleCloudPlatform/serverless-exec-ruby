name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  CI:
    if: ${{ github.repository == 'GoogleCloudPlatform/serverless-exec-ruby' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "2.6"
            task: test
          - os: ubuntu-latest
            ruby: "2.7"
            task: test
          - os: ubuntu-latest
            ruby: "3.0"
            task: test
          - os: ubuntu-latest
            ruby: "2.7"
            task: rubocop , build , yardoc
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      with:
        persist-credentials: false
    - name: Install Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
      with:
        ruby-version: "${{ matrix.ruby }}"
    - name: Install NodeJS 16.x
      uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2.5.2
      with:
        node-version: "16.x"
    - name: Install tools
      shell: bash
      run: "bundle install && gem install --no-document toys"
    - name: Test ${{ matrix.task }}
      shell: bash
      run: toys do ${{ matrix.task }} < /dev/null
